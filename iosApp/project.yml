name: iosApp
options:
  bundleIdPrefix: uz.softonic.eexpert
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.softonic.eexpert
        PRODUCT_NAME: iosApp
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    configFiles:
      Debug: Configuration/Config.xcconfig
      Release: Configuration/Config.xcconfig
    preBuildScripts:
      - name: Build Kotlin/Native Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
